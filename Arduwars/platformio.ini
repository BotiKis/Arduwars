; PlatformIO Project Configuration File
;
; Build:   pio run
; Upload:  pio run -t upload
; Sizes:   pio run -v   (the "RAM:" and "Flash:" lines at the end)
;
; Two targets:
;   arduboy     - original Arduboy (stock Caterina bootloader, ~28KB usable flash)
;   arduboy_fx  - Arduboy FX / FX-C (defines ARDUWARS_FX for FX-only features later)

[env]
platform = atmelavr
board = arduboy
framework = arduino
lib_extra_dirs = lib
lib_deps =
  mlxxxp/Arduboy2@^6.0.0
  https://github.com/yinkou/Arduboy-TinyFont.git
build_flags = -Wall

[env:arduboy]

[env:arduboy_fx]
build_flags = ${env.build_flags} -DARDUWARS_FX
